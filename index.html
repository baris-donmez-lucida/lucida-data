<!doctype html><html lang="tr"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Lucida Data</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Product Engagement v2: fixed left menu (11 sections, hash routes) + one reading column.
     Every section: KPI cards, then timeline cards, then tables. Same tokens as dashboard.html. */
  :root {
    --bg: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11, 11, 11, 0.10); --track: #ebeae4;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #7e3fb8; --s5: #3bb8c4; --s6: #c9a227; --s7: #e8705f;
    --font-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10); --track: #2c2c2a;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9b5de5; --s5: #4fc3d0; --s6: #d6b23a; --s7: #ef7f6e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10); --track: #2c2c2a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9b5de5; --s5: #4fc3d0; --s6: #d6b23a; --s7: #ef7f6e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  a { color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
  button, select { font: inherit; }

  /* Lock screen (same as the other pages; password shared through localStorage) */
  .lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 32px 16px; }
  .lock-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 24px; display: grid; gap: 16px; }
  .lock-card .brand { font-size: 24px; }
  .lock-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .lock-card label { font-size: 13px; font-weight: 500; color: var(--ink-2); display: grid; gap: 6px; }
  .lock-card input[type=password] { font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); width: 100%; }
  .lock-card .remember { display: flex; align-items: center; gap: 8px; font-weight: 400; }
  .lock-card button { font-weight: 600; font-size: 15px; padding: 11px 14px; border-radius: 9px; border: 0; background: var(--ink); color: var(--bg); cursor: pointer; }
  .lock-card button:disabled { opacity: 0.6; cursor: progress; }
  .lock-err { font-size: 13px; color: var(--s2); min-height: 1.2em; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; margin: 0; }

  /* Shell: sidebar + main */
  .shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100vh; }
  .side { min-width: 0; }
  @media (min-width: 960px) { .shell { grid-template-columns: 228px minmax(0, 1fr); } }
  .side { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px max(16px, env(safe-area-inset-left, 0px)) 0; position: sticky; top: 0; z-index: 5; }
  @media (min-width: 960px) { .side { border-bottom: 0; border-right: 1px solid var(--border); height: 100vh; overflow-y: auto; padding: 22px 14px; } }
  .side-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .side-head small { font-size: 12px; color: var(--muted); }
  .nav { display: flex; gap: 2px; overflow-x: auto; padding: 10px 0 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  @media (min-width: 960px) { .nav { flex-direction: column; overflow: visible; padding: 18px 0 0; } }
  .nav a { display: block; white-space: nowrap; text-decoration: none; font-size: 13.5px; font-weight: 500; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; }
  .nav a:hover { color: var(--ink); background: var(--track); }
  .nav a[aria-current="page"] { color: var(--ink); background: var(--track); font-weight: 600; }
  .nav .grp { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 6px 10px; white-space: nowrap; align-self: center; }
  @media (min-width: 960px) { .nav .grp { padding: 18px 10px 4px; } }
  .nav a.old { color: var(--muted); }
  .nav a.old::after { content: " ↗"; font-size: 11px; }

  main { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); min-width: 0; }
  @media (min-width: 960px) { main { padding: 0 32px 64px; } }
  .wrap { max-width: 1120px; margin: 0 auto; min-width: 0; }

  /* Top bar: title, data date, range, compare, filters */
  .top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 20px 0 16px; border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--bg); z-index: 4; }
  @media (max-width: 959px) { .top { position: static; } }
  .top-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(24px, 3.4vw, 30px); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
  .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .meta b { color: var(--ink-2); font-weight: 500; }
  .lock-out { background: none; border: 0; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .ctl-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .seg-ctl { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--track); }
  .seg-ctl button { font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: none; border: 0; padding: 3px 9px; border-radius: 7px; cursor: pointer; line-height: 1.4; }
  .seg-ctl button:hover { color: var(--ink); }
  .seg-ctl button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08); }
  .seg-ctl button:disabled { opacity: .45; cursor: not-allowed; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
  .chk.off { opacity: .5; cursor: not-allowed; }
  .flt { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .flt select, .card select { font-size: 12.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; max-width: 160px; }
  .flt select.on { border-color: var(--ink-2); font-weight: 600; }

  /* Sections */
  .sec { padding-top: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .grp-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .kpi-grp { grid-column: 1 / -1; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 -6px; }
  .kpi-grp:first-child { margin-top: 0; }
  .nk-basis { margin-left: 6px; }
  .grp-nav button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .grp-nav button:hover { color: var(--ink); }
  .ugrp { display: grid; gap: 14px; }
  .kpis.big .kpi[data-mid] { cursor: pointer; transition: border-color .15s; }
  .kpis.big .kpi[data-mid]:hover { border-color: var(--s1); }
  .back { font-size: 13px; font-weight: 600; color: var(--ink-2); text-decoration: none; justify-self: start; }
  .back:hover { color: var(--ink); }
  .ugrp + .ugrp { margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--border); }
  .grp-h { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .sec-intro { margin: 0; font-size: 13px; color: var(--ink-2); max-width: 78ch; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 12px; }
  @media (min-width: 1100px) { .kpis { grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px 8px; display: grid; gap: 3px; min-width: 0; position: relative; align-content: start; }
  .kpi-h { display: flex; align-items: center; gap: 6px; min-height: 20px; }
  .kpi-l { font-size: 12px; font-weight: 500; color: var(--ink-2); flex: 1; min-width: 0; }
  .kpi-v { font-size: clamp(22px, 3vw, 28px); font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi-s, .kpi-d { font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; }
  .kpi-s b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi svg.spark { width: 100%; height: 28px; display: block; margin-top: 2px; }
  .spark-w { position: relative; cursor: crosshair; }
  .sp-dot { position: absolute; display: none; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--s1); box-shadow: 0 0 0 2px var(--surface); pointer-events: none; }
  .spark-w.on .sp-dot { display: block; }
  /* Overview: fewer, larger cards */
  .kpis.big { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 16px; }
  @media (min-width: 1100px) { .kpis.big { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .kpis.big .kpi { padding: 20px 22px 14px; gap: 6px; border-radius: 14px; }
  .kpis.big .kpi-h { min-height: 28px; }
  .kpis.big .kpi-l { font-size: 14px; }
  .kpis.big .ut-sel { font-size: 14px; padding: 4px 8px; }
  .kpis.big .kpi-v { font-size: clamp(32px, 4vw, 42px); margin-top: 4px; }
  .kpis.big .kpi-s, .kpis.big .kpi-d { font-size: 13.5px; }
  .kpis.big svg.spark { height: 56px; }
  .kpis.big .spark-w { margin-top: 8px; }
  .kpis.big + .cards { margin-top: 28px; }
  .cards.ov { row-gap: 28px; }
  table.ret { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  table.ret th, table.ret td { padding: 10px 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  table.ret th { font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--surface); position: sticky; top: 0; }
  table.ret th:first-child, table.ret td:first-child { text-align: left; }
  table.ret td { color: var(--ink); }
  table.ret td.n { color: var(--ink-2); }
  table.ret td.na { background: var(--bg); }
  table.ret td.we { color: var(--s1); font-weight: 600; }
  table.ret { --pos: #22c55e; --neg: #ef4444; }
  table.ret tr.tot td { background: var(--surface-2, var(--surface)); }
  table.ret tr.tot td { font-weight: 700; border-bottom: 2px solid var(--border); }
  table.daily td.up { color: var(--s3); font-weight: 600; }
  table.daily td.down { color: var(--s2); font-weight: 600; }
  .spark path { fill: none; stroke: var(--s1); stroke-width: 1.5; }
  .delta { font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta.good { color: var(--s3); }
  .delta.bad { color: var(--s2); }
  .help { flex: none; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--border); background: none; color: var(--muted); font-size: 10.5px; font-weight: 600; line-height: 1; padding: 0; cursor: help; }
  .help:hover { color: var(--ink); border-color: var(--ink-2); }
  .tag { flex: none; font-size: 10.5px; color: var(--muted); border: 1px dashed var(--border); border-radius: 6px; padding: 0 5px; white-space: nowrap; }
  .badge { flex: none; font-size: 10.5px; font-weight: 700; color: #fff; background: var(--s2); border-radius: 6px; padding: 0 5px; cursor: help; }
  .notebox { font-size: 12px; color: var(--ink-2); background: var(--track); border-radius: 8px; padding: 7px 9px; margin: 2px 0; }

  .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  @media (min-width: 1100px) { .cards { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .card.wide { grid-column: 1 / -1; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; position: relative; align-content: start; }
  .card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .card-top h2 { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--ink); flex: 1; min-width: 0; }
  .card-sub { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
  .card-sub b { color: var(--ink-2); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12px; color: var(--ink-2); }
  .legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
  .legend i.sq { width: 10px; height: 10px; border-radius: 3px; }
  .legend i.dash { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
  .cc-host { margin-left: auto; }
  .cc { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12px; color: var(--muted); }
  .cc input[type=date], .cc select, .ut-sel { font: inherit; font-size: 12px; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px 6px; }
  .cc-f { position: relative; }
  .cc-f summary { list-style: none; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px 9px; background: var(--surface); white-space: nowrap; }
  .cc-f summary::-webkit-details-marker { display: none; }
  .cc-f summary::before { content: "⚲ "; }
  .cc-f summary.on { color: var(--ink); border-color: var(--ink-2); font-weight: 600; }
  .cc-pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 8; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: grid; gap: 8px; min-width: 210px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
  .cc-pop label { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
  .cc-pop select { width: 100%; max-width: none; }
  .cc-clear { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; justify-self: start; padding: 0; }
  .ut-sel { font-weight: 600; color: var(--ink); }
  .placeholder { font-size: 13px; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; padding: 18px; }

  /* Charts (SVG, same approach as dashboard.html) */
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart .ln { fill: none; stroke: var(--c); stroke-width: 1.2; opacity: 0.42; stroke-linejoin: round; }
  .chart .ma { fill: none; stroke: var(--c); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
  .chart .ma.only { stroke-width: 2; }
  .chart .prev { fill: none; stroke: var(--c); stroke-width: 1.6; stroke-dasharray: 4 4; opacity: 0.7; }
  .chart .pt-faded { fill: var(--c); opacity: 0.28; }
  .chart .pt-hollow { fill: var(--surface); stroke: var(--c); stroke-width: 1.4; }
  .chart .chg { stroke: var(--s6); stroke-width: 1; stroke-dasharray: 2 3; }
  .chart text.chg-lbl { fill: var(--s6); font-size: 10.5px; font-weight: 600; }
  .chart .thr { stroke: var(--s2); stroke-width: 1; stroke-dasharray: 5 4; }
  .chart .bar { fill: var(--c); }
  .chart .hover-line { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; }
  .chart .hover-dot { stroke: var(--surface); stroke-width: 2; opacity: 0; }
  .chart .hit { fill: transparent; }
  .chart-empty { font-size: 13px; color: var(--muted); padding: 34px 0; text-align: center; }
  .tip { position: absolute; pointer-events: none; display: none; z-index: 6; background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
  .tip b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
  .tip small { opacity: .75; }

  /* Ladder, flow strip */
  .ladder { display: grid; gap: 6px; }
  .rung { display: grid; grid-template-columns: minmax(96px, 30%) 1fr auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
  .rung-bar { height: 16px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .rung-bar i { display: block; height: 100%; background: var(--c, var(--s1)); border-radius: 4px; }
  .rung b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
  .rung small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
  .flow .st { flex: 1 1 130px; background: var(--track); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
  .flow .st span { font-size: 12px; color: var(--ink-2); }
  .flow .st b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .flow .st small { font-size: 11.5px; color: var(--muted); }
  .flow .ar { align-self: center; color: var(--muted); font-size: 16px; }
  .flow .loop { flex-basis: 100%; font-size: 12px; color: var(--ink-2); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 12px; }
  .buckets { display: grid; gap: 8px; }
  .bk-row { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .bk { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--track); }
  .bk i { display: block; height: 100%; background: var(--c); }

  /* Tables */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { font-size: 12px; font-weight: 600; color: var(--ink-2); position: sticky; top: 0; background: var(--surface); }
  thead th.sort { cursor: pointer; user-select: none; }
  thead th.sort:hover { color: var(--ink); }
  thead th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
  thead th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
  tbody td { font-variant-numeric: tabular-nums; color: var(--ink-2); }
  tbody td:first-child { color: var(--ink); }
  tbody tr:last-child td { border-bottom: 0; }
  td.faded { opacity: .45; }
  td.wrap, th.wrap { white-space: normal; text-align: left; min-width: 180px; max-width: 320px; }
  table.daily td.wrap { font-size: 12px; color: var(--muted); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--track); }
  tr.open td { background: var(--track); }
  tr.detail td { background: var(--bg); text-align: left; white-space: normal; color: var(--ink-2); font-size: 12.5px; }
  .det { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 22px; padding: 4px 0; }
  .det h4 { margin: 0 0 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .det table td { padding: 2px 6px; border: 0; font-size: 12px; }
  .defs-tbl td.wrap { color: var(--ink-2); }
  code { font-size: 12px; }
  footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--grid); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
</style></head><body>

<div class="lock" id="lock">

<script>
// ============================================================
// PRODUCT ENGAGEMENT v2 — product.enc.json (scripts/build-product.mjs):
//   days, catalog (metrics.json with num/den normalised), m[key][sub][slice] = counts per day,
//   r[metric][slice] = funnel rates / minutes per day (paid), mix, ret, co (new subscriber cohorts),
//   les (lessons by week), hist, changes, meta, missing.
// sub: paid | store | web.  slice: all | p:<platform> | c:<country> | v:<version>.
// ============================================================
const nf = new Intl.NumberFormat("tr-TR");
const nf1 = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat("tr-TR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const utc = (ymd) => new Date(ymd + "T00:00:00Z");
const dShort = (ymd) => new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "short", timeZone: "UTC" }).format(utc(ymd));
const dLong = (ymd) => new Intl.DateTimeFormat("tr-TR", { weekday: "short", day: "numeric", month: "long", timeZone: "UTC" }).format(utc(ymd));
const dYear = (ymd) => new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }).format(utc(ymd));
const tsFmt = (iso) => new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "UTC" }).format(new Date(iso)) + " UTC";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const addDays = (ymd, k) => new Date(utc(ymd).getTime() + k * 864e5).toISOString().slice(0, 10);
const monday = (ymd) => addDays(ymd, -((utc(ymd).getUTCDay() + 6) % 7));
const sum = (a) => a.reduce((s, x) => s + (x || 0), 0);
const nn = (a) => a.filter((x) => x != null && Number.isFinite(x));
const mean = (a) => { const b = nn(a); return b.length ? sum(b) / b.length : null; };
const median = (a) => { const b = nn(a).sort((x, y) => x - y); if (!b.length) return null; const h = b.length >> 1; return b.length % 2 ? b[h] : (b[h - 1] + b[h]) / 2; };

const TR_COUNTRY = { "United States": "ABD", "South Korea": "Güney Kore", "Japan": "Japonya", "Poland": "Polonya", "Czech Republic": "Çekya", "Hungary": "Macaristan", "United Kingdom": "Birleşik Krallık", "Philippines": "Filipinler", "Brazil": "Brezilya", "Turkey": "Türkiye" };
const SUB_LABEL = { paid: "Tümü", store: "Mağaza", web: "Web" };
const COL = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)"];
const MIN_DEN = 50;
// lower is better for these (colour of the change arrows)
const LOWER_BETTER = new Set(["abandon_rate", "abandon_rate_s", "abandon_rate_u", "abandon_after_1min", "rating_low_rate", "tech_fail_rate", "speech_zero_rate"]);

const D = { d: null, cat: {} };
const S = { tab: "genel", range: 28, cmp: false, dim: null, val: "", sub: "paid" };
const N = () => D.d.days.length;
const win = () => { const n = N(); return [Math.max(0, n - S.range), n - 1]; };
const prevWin = () => { const [i0] = win(); return i0 - S.range >= 0 ? [i0 - S.range, i0 - 1] : null; };
const sliceOf = (f) => (f.dim ? { platform: "p:", country: "c:", version: "v:" }[f.dim] + f.val : "all");
const sliceKey = () => sliceOf(S);

// ---------- formatting ----------
function fmt(unit, v, opts = {}) {
  if (v == null || !Number.isFinite(v)) return "—";
  if (unit === "pct") return "%" + nf1.format(v * 100);
  if (unit === "min") return (v >= 1000 ? nf.format(Math.round(v)) : nf1.format(v)) + " dk";
  if (unit === "ratio") return opts.days ? nf1.format(v * 7) + " gün" : nf2.format(v);
  return nf.format(Math.round(v));
}
const PERIOD_LABEL = { sum: "dönem toplamı", daily_mean: "günlük ort.", last: "son gün", ratio_of_sums: "dönem", mean_of_daily: "günlük ort.", median_of_daily: "günlük medyanların medyanı", share_of_sums: "pay", matured_cohorts: "olgun kohortlar", own_selector: "" };

// ---------- series ----------
// raw series of a stored key (m) for sub/slice; a stored key without that slice = no events → zeros
function raw(key, sub, slice) {
  const k = D.d.m[key];
  if (!k || !k[sub]) return null;
  return k[sub][slice] || (k[sub].all ? k[sub].all.map(() => 0) : null);
}
// "a+b", "a-b", "x[cat]" over stored keys
function expr(e, sub, slice) {
  const terms = e.match(/[+-]?[^+-]+/g);
  let out = null;
  for (const t of terms) {
    const sign = t[0] === "-" ? -1 : 1, key = t.replace(/^[+-]/, "");
    const c = D.cat[key];
    const v = c && c.num ? ratioVals(c, sub, slice).vals : raw(c?.series || key, sub, slice);
    if (!v) return null;
    out = out ? out.map((x, i) => (x == null || v[i] == null ? null : x + sign * v[i])) : v.map((x) => (x == null ? null : sign * x));
  }
  return out;
}
function ratioVals(c, sub, slice) {
  const num = expr(c.num, sub, slice), den = expr(c.den, sub, slice);
  if (!num || !den) return { vals: null };
  return { num, den, vals: num.map((x, i) => (x == null || den[i] == null || !den[i] ? null : x / den[i])) };
}
// a metric under the current filters → { vals, num?, den?, tag (filter not supported), sub, slice }
function series(id, f = S) {
  const c = D.cat[id];
  if (!c) return { vals: null };
  const bd = c.breakdowns || [];
  const dimOk = !f.dim || bd.includes(f.dim), subOk = f.sub === "paid" || bd.includes("subType");
  const slice = dimOk ? f.slice ?? sliceOf(f) : "all", sub = subOk ? f.sub : "paid";
  let o;
  if (c.rate) o = { vals: D.d.r[c.rate]?.[slice] || null };
  else if (c.num) o = ratioVals(c, sub, slice);
  else o = { vals: raw(c.series || id, sub, slice) };
  return { ...o, tag: !dimOk || !subOk, sub, slice };
}
// value of a metric over [i0, i1] by its period rule
function periodValue(c, s, i0, i1) {
  if (!s.vals) return null;
  const v = s.vals.slice(i0, i1 + 1);
  switch (c.period) {
    case "sum": return nn(v).length ? sum(v) : null;
    case "daily_mean": case "mean_of_daily": return mean(v);
    case "last": { const b = nn(v); return b.length ? b[b.length - 1] : null; }
    case "median_of_daily": return median(v);
    case "ratio_of_sums": {
      if (!s.num) return mean(v);
      let a = 0, b = 0;
      for (let i = i0; i <= i1; i++) if (s.num[i] != null && s.den[i] != null && s.den[i] > 0) { a += s.num[i]; b += s.den[i]; }
      return b ? a / b : null;
    }
    default: return mean(v);
  }
}
// 7-day moving average (ratio metrics: Σnum / Σden over the window)
function movingAvg(s) {
  const v = s.vals, out = new Array(v.length).fill(null);
  for (let i = 0; i < v.length; i++) {
    if (i < 6) continue;
    if (s.num) {
      let a = 0, b = 0, k = 0;
      for (let j = i - 6; j <= i; j++) if (s.num[j] != null && s.den[j] > 0) { a += s.num[j]; b += s.den[j]; k++; }
      out[i] = k >= 4 && b ? a / b : null;
    } else {
      const w = nn(v.slice(i - 6, i + 1));
      out[i] = w.length >= 4 ? sum(w) / w.length : null;
    }
  }
  return out;
}

// ---------- alerts ----------
function alertText(c, s) {
  const v = s.vals; if (!v) return null;
  const i = v.length - 1, x = v[i];
  const msgs = [];
  if (x != null) {
    const ref = [7, 14, 21, 28].map((k) => v[i - k]).filter((y) => y != null);
    if (ref.length === 4) {
      const m = mean(ref), sd = Math.sqrt(mean(ref.map((y) => (y - m) ** 2)));
      if (sd > 0 && Math.abs(x - m) > 2 * sd) msgs.push(`Son gün (${fmt(c.unit, x)}) son 4 haftanın aynı günlerinin ortalamasından (${fmt(c.unit, m)}) 2 standart sapmadan fazla ${x > m ? "yüksek" : "düşük"}.`);
    }
  }
  if (c.alert) {
    const [op, th] = c.alert.split(" "), n = N(), pv = periodValue(c, s, n - 7, n - 1);
    if (pv != null && (op === ">" ? pv > Number(th) : pv < Number(th))) msgs.push(`Son 7 gün ${fmt(c.unit, pv)}: eşik ${fmt(c.unit, Number(th))} aşıldı.`);
  }
  return msgs.length ? msgs.join(" ") : null;
}

// ---------- known data gaps (shown above the section when the range covers them) ----------
const DATA_NOTES = [
  { from: "2026-07-28", to: "2026-07-31", text: "<b>call_ok</b> 2.8.1 ile eklendi (ilk görülme 28 Temmuz); 1 Ağustos'a kadar eksik. Bu günlerde Aktif ve Aktif'e bölünen oranlar (North Star / Aktif, konuşma oranı, dk / aktif …) güvenilmez." },
  { from: "2026-08-28", to: "2026-08-31", text: "<b>28–31 Ağustos kesintisi:</b> call_ok neredeyse hiç atılmadı (29 Ağustos'ta günlük değerin onda biri) ve konuşmaların çoğunda speech_duration = 0. Büyük ihtimalle bağlantı ya da izleme sorunu; bu günlerde Aktif ve konuşma dakikası düşük görünür." },
];
function dataNotes() {
  const [i0, i1] = win(), a = D.d.days[i0], b = D.d.days[i1];
  const hit = DATA_NOTES.filter((n) => n.to >= a && n.from <= b);
  return hit.length ? `<div class="notebox"><b>Veri notu:</b> ${hit.map((n) => n.text).join(" ")}</div>` : "";
}

// ---------- change arrows ----------
function deltaSpan(c, cur, prev, label, opts = {}) {
  if (cur == null || prev == null) return "";
  let txt, d;
  if (c.unit === "pct") { d = cur - prev; txt = nf1.format(Math.abs(d) * 100); }
  else { if (!prev) return ""; d = (cur - prev) / Math.abs(prev); txt = "%" + nf1.format(Math.abs(d) * 100); }
  const flat = c.unit === "pct" ? Math.abs(d) < 0.0005 : Math.abs(d) < 0.005;
  const good = LOWER_BETTER.has(c.id) ? d < 0 : d > 0;
  // label "" = arrow and number only (overview); the comparison is kept in the tooltip
  return `<span${label ? "" : ` title="${esc(opts.title || "")}"`}><span class="delta ${flat ? "" : good ? "good" : "bad"}">${flat ? "=" : d > 0 ? "▲" : "▼"} ${txt}</span>${label ? " " + label : ""}</span>`;
}

// ---------- chart primitives ----------
const niceStep = (span) => { const r = span / 4, mag = 10 ** Math.floor(Math.log10(r || 1)); return [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => s >= r) || mag * 10; };
function placeTip(tip, card, svg, W, H, px, py, html) {
  const rect = svg.getBoundingClientRect(), box = card.getBoundingClientRect();
  tip.innerHTML = html;
  tip.style.left = `${Math.min(Math.max(rect.left - box.left + (px * rect.width) / W, 110), box.width - 110)}px`;
  tip.style.top = `${rect.top - box.top + (py * rect.height) / H}px`;
  tip.style.display = "block";
}
function changesIn(x) {
  const set = new Map(x.map((d, i) => [d, i]));
  return (D.d.changes || []).map((ch) => [set.has(ch.d) ? set.get(ch.d) : x.findIndex((d) => d >= ch.d && d <= addDays(ch.d, 6)), ch]).filter(([i]) => i >= 0);
}
// Line chart over x (dates). series: [{ name, color, vals, ma?, prev?, faded?[i], hollow?[i], fmt, detail?(i) }]
function lineChart(host, card, x, series, opts = {}) {
  const tip = card.querySelector(".tip");
  const ok = (v) => v != null && Number.isFinite(v);
  const all = series.flatMap((s) => [...s.vals.filter((v, i) => !s.faded?.[i]), ...(s.ma || []), ...(s.prev || [])]).filter(ok);
  if (!all.length) { host.innerHTML = `<div class="chart-empty">Bu seçimde veri yok.</div>`; return; }
  const n = x.length, W = Math.max(300, Math.round(host.clientWidth || 600)), H = opts.H || 200;
  const padL = 50, padR = 12, padT = opts.xTip ? 12 : 20, padB = 24;
  let maxV = Math.max(...all, opts.threshold ?? 0);
  let step = niceStep(maxV || 1);
  let y1 = Math.max(Math.ceil((maxV * 1.06) / step) * step, step);
  // percent of a subset: above 100 % only happens on data-gap days → keep the 0–100 % axis, clip those
  if (opts.pctMax && y1 > 1) { const q = [...all].sort((p, r) => p - r)[Math.floor(all.length * 0.9)]; if (q <= 1) { y1 = 1; step = 0.25; } }
  const inRange = (v) => ok(v) && v <= y1 * 1.02;
  const y = (v) => padT + (1 - v / y1) * (H - padT - padB);
  const X = (i) => padL + (n > 1 ? (i / (n - 1)) * (W - padL - padR) : (W - padL - padR) / 2);
  const ticks = []; for (let t = 0; t <= y1 + 1e-9; t += step) ticks.push(t);
  const every = Math.max(1, Math.ceil(n / Math.floor((W - padL - padR) / 58)));
  const xl = x.map((d, i) => ((n - 1 - i) % every === 0 ? `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === n - 1 ? "end" : i === 0 ? "start" : "middle"}">${opts.xFmt ? opts.xFmt(d, i) : dShort(d)}</text>` : "")).join("");
  const path = (vals) => { let s = "", pen = false; vals.forEach((v, i) => { if (!inRange(v)) { pen = false; return; } s += `${pen ? "L" : "M"}${X(i).toFixed(1)} ${y(v).toFixed(1)} `; pen = true; }); return s; };
  const yf = opts.yFmt || ((t) => nf.format(t));
  // release markers: dashed line + version label at the top
  const chg = opts.xTip ? "" : changesIn(x).map(([i, ch]) => `<line class="chg" x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${padT - 4}" y2="${H - padB}"><title>${esc(dShort(ch.d) + " · " + ch.note)}</title></line><text class="chg-lbl" x="${X(i).toFixed(1)}" y="${padT - 7}" text-anchor="middle">${esc(ch.version || "◆")}</text>`).join("");
  const body = series.map((s) => {
    const st = `style="--c:${s.color}"`;
    let out = "";
    if (s.prev) out += `<path class="prev" ${st} d="${path(s.prev)}"/>`;
    if (s.ma) out += `<path class="ln" ${st} d="${path(s.vals)}"/><path class="ma" ${st} d="${path(s.ma)}"/>`;
    else out += `<path class="ma only" ${st} d="${path(s.vals)}"/>`;
    s.vals.forEach((v, i) => {
      if (!inRange(v)) return;
      if (s.hollow?.[i]) out += `<circle class="pt-hollow" ${st} cx="${X(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8"/>`;
      else if (s.faded?.[i]) out += `<circle class="pt-faded" ${st} cx="${X(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6"/>`;
    });
    return out;
  }).join("");
  const thr = opts.threshold != null ? `<line class="thr" x1="${padL}" x2="${W - padR}" y1="${y(opts.threshold).toFixed(1)}" y2="${y(opts.threshold).toFixed(1)}"/><text x="${W - padR}" y="${(y(opts.threshold) - 4).toFixed(1)}" text-anchor="end">eşik ${yf(opts.threshold)}</text>` : "";
  const hits = x.map((_, i) => { const l = i === 0 ? padL : (X(i - 1) + X(i)) / 2, r = i === n - 1 ? W - padR : (X(i) + X(i + 1)) / 2; return `<rect class="hit" data-i="${i}" x="${l.toFixed(1)}" y="${padT}" width="${Math.max(1, r - l).toFixed(1)}" height="${H - padT - padB}"/>`; }).join("");
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "")}">
    ${ticks.map((t) => `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${padL - 7}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${yf(t)}</text>`).join("")}
    ${chg}${thr}${body}${xl}
    <line class="hover-line" x1="0" x2="0" y1="${padT}" y2="${H - padB}"/>
    ${series.map((s, k) => `<circle class="hover-dot" data-k="${k}" r="4" style="fill:${s.color}"/>`).join("")}${hits}</svg>`;
  const svg = host.querySelector("svg"), hl = svg.querySelector(".hover-line"), dots = [...svg.querySelectorAll(".hover-dot")];
  const show = (i) => {
    hl.setAttribute("x1", X(i)); hl.setAttribute("x2", X(i)); hl.style.opacity = 1;
    dots.forEach((dt, k) => { const v = series[k].ma?.[i] ?? series[k].vals[i]; if (!inRange(v)) { dt.style.opacity = 0; return; } dt.setAttribute("cx", X(i)); dt.setAttribute("cy", y(v)); dt.style.opacity = 1; });
    const top = Math.min(...series.map((s) => (inRange(s.vals[i]) ? y(s.vals[i]) : H)));
    const lines = series.map((s) => {
      const v = s.vals[i];
      const det = s.detail ? s.detail(i) : "";
      const ma = s.ma && s.ma[i] != null ? ` <small>7g ort. ${s.fmt(s.ma[i])}</small>` : "";
      const pv = s.prev && s.prev[i] != null ? ` <small>önceki ${s.fmt(s.prev[i])}</small>` : "";
      return `<br><span class="sw" style="background:${s.color}"></span>${esc(s.name)}: <b>${v == null ? "—" : s.fmt(v)}</b>${det}${ma}${pv}`;
    }).join("");
    const ch = opts.xTip ? "" : (D.d.changes || []).filter((c) => (opts.week ? c.d >= x[i] && c.d <= addDays(x[i], 6) : c.d === x[i])).map((c) => `<br><small>▏ ${esc(c.note)}</small>`).join("");
    placeTip(tip, card, svg, W, H, X(i), top, (opts.xTip ? opts.xTip(i) : opts.week ? dShort(x[i]) + " haftası" : dLong(x[i])) + lines + ch);
  };
  const hide = () => { hl.style.opacity = 0; dots.forEach((d) => { d.style.opacity = 0; }); tip.style.display = "none"; };
  svg.addEventListener("pointermove", (ev) => { const t = ev.target.closest("rect.hit"); if (t) show(Number(t.dataset.i)); else hide(); });
  svg.addEventListener("pointerleave", hide);
}
// Stacked bars over x. cats: [{ name, color, vals }]; pct → each bar normalised to 100 %
function stackChart(host, card, x, cats, opts = {}) {
  const tip = card.querySelector(".tip");
  const n = x.length, tot = x.map((_, i) => sum(cats.map((c) => c.vals[i] || 0)));
  if (!tot.some((t) => t > 0)) { host.innerHTML = `<div class="chart-empty">Bu seçimde veri yok.</div>`; return; }
  const W = Math.max(300, Math.round(host.clientWidth || 600)), H = opts.H || 200, padL = 50, padR = 12, padT = 10, padB = 24;
  const maxV = opts.pct ? 1 : Math.max(...tot);
  const step = opts.pct ? 0.25 : niceStep(maxV), y1 = opts.pct ? 1 : Math.max(Math.ceil((maxV * 1.06) / step) * step, step);
  const y = (v) => padT + (1 - v / y1) * (H - padT - padB);
  const slot = (W - padL - padR) / n, bw = Math.max(1, Math.min(26, slot * 0.78));
  const X = (i) => padL + slot * (i + 0.5);
  const ticks = []; for (let t = 0; t <= y1 + 1e-9; t += step) ticks.push(t);
  const yf = opts.pct ? (t) => "%" + nf.format(t * 100) : opts.yFmt || ((t) => nf.format(t));
  const every = Math.max(1, Math.ceil(n / Math.floor((W - padL - padR) / 58)));
  let bars = "";
  x.forEach((_, i) => {
    let acc = 0;
    cats.forEach((c) => {
      const v = (c.vals[i] || 0) / (opts.pct ? tot[i] || 1 : 1);
      if (v <= 0) return;
      bars += `<rect class="bar" style="--c:${c.color}" x="${(X(i) - bw / 2).toFixed(1)}" y="${y(acc + v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(acc) - y(acc + v)).toFixed(1)}"/>`;
      acc += v;
    });
  });

// Sparkline; tips[i] = hover text for point i (shown by the document-level handler below)
function spark(vals, tips) {
  const v = vals.map((x) => (x == null ? null : x)), b = nn(v);
  if (b.length < 2) return "";
  const W = 200, H = 28, lo = Math.min(...b), hi = Math.max(...b), sp = hi - lo || 1;
  let d = "", pen = false;
  v.forEach((x, i) => { if (x == null) { pen = false; return; } d += `${pen ? "L" : "M"}${((i / (v.length - 1)) * W).toFixed(1)} ${(H - 2 - ((x - lo) / sp) * (H - 4)).toFixed(1)} `; pen = true; });
  const pts = v.map((x) => (x == null ? null : +(1 - (2 + ((x - lo) / sp) * (H - 4)) / H).toFixed(3)));

document.addEventListener("pointermove", (ev) => {
  const w = ev.target.closest?.(".spark-w[data-tips]");

  if (!w) return;

  const i = Math.max(0, Math.min(n - 1, Math.round(((ev.clientX - r.left) / r.width) * (n - 1))));

  const x = (i / (n - 1)) * r.width, y = pts[i] * r.height, tip = w.querySelector(".tip"), dot = w.querySelector(".sp-dot");

  dot.style.left = x + "px"; dot.style.top = y + "px";
  tip.innerHTML = tips[i]; tip.style.display = "block"; tip.style.top = y + "px";

// ---------- building blocks ----------
const helpBtn = (txt) => (txt ? `<button type="button" class="help" title="${esc(txt)}" data-help="${esc(txt)}">?</button>` : "");
const tagHtml = (on, txt = "bu kırılım yok") => (on ? `<span class="tag" title="Seçili filtre bu metrikte yok; tümü gösteriliyor">${txt}</span>` : "");
const badgeHtml = (txt) => (txt ? `<span class="badge" title="${esc(txt)}">!</span>` : "");
function noteOf(c) {
  const src = c.num ? `Pay: ${c.num} · payda: ${c.den}.` : "";
  return [c.note, src, `Dönem değeri: ${PERIOD_LABEL[c.period] || c.period}.`].filter(Boolean).join(" ");
}

// KPI card: [metric, countMetric?, extraMetric?, { mode }]. mode "day" = last complete day vs the day before,
// "week" = last 7 days vs the 7 before (one comparison each); default = the selected range.
function kpiCard(id, countId, extraId, opts = {}) {
  const c = D.cat[id];
  if (!c) return "";
  const s = series(id), n = N();
  if (!s.vals) return `<div class="kpi" data-mid="${id}"><div class="kpi-h"><span class="kpi-l">${esc(c.label)}</span>${helpBtn(noteOf(c))}</div><div class="kpi-v">—</div><div class="kpi-s">veri yok</div></div>`;
  let w, pw, cmpLabel;
  if (opts.mode === "day") { w = [n - 1, n - 1]; pw = [n - 2, n - 2]; cmpLabel = "önceki güne göre"; }
  else if (opts.mode === "week") { w = [n - 7, n - 1]; pw = [n - 14, n - 8]; cmpLabel = "önceki 7 güne göre"; }
  else { w = win(); pw = prevWin(); cmpLabel = `önceki ${S.range} güne göre`; }
  const [i0, i1] = w;
  const cur = periodValue(c, s, i0, i1);
  const isStick = id.startsWith("stickiness");
  let subs = [];
  if (isStick) subs.push(`<span>haftada <b>${fmt("ratio", cur, { days: true })}</b></span>`);
  if (opts.own && s.num) {
    let a = 0, b = 0;
    for (let i = i0; i <= i1; i++) { a += s.num[i] || 0; b += s.den[i] || 0; }
    subs.push(`<span><b>${nf.format(Math.round(a))}</b>${opts.withDen ? ` / ${nf.format(Math.round(b))}` : ""} ${esc(opts.own)}</span>`);
  }
  if (opts.sub) subs.push(opts.sub(i0, i1));
  if (countId && D.cat[countId]) { const cc = D.cat[countId], cs = series(countId); subs.push(`<span><b>${fmt(cc.unit, periodValue(cc, cs, i0, i1))}</b> ${esc(shortLabel(cc))}</span>`); }
  if (extraId && D.cat[extraId]) { const ec = D.cat[extraId], es = series(extraId); subs.push(`<span>${esc(shortLabel(ec))} <b>${fmt(ec.unit, periodValue(ec, es, i0, i1))}</b></span>`); }
  if (!opts.mode) subs.push(`<span>${PERIOD_LABEL[c.period] || ""}</span>`);
  const deltas = [];
  if (pw && pw[0] >= 0) deltas.push(opts.mode ? deltaSpan(c, cur, periodValue(c, s, pw[0], pw[1]), "", { title: cmpLabel }) : deltaSpan(c, cur, periodValue(c, s, pw[0], pw[1]), cmpLabel));
  if (!opts.mode && n > 28 && s.vals[n - 1] != null && s.vals[n - 29] != null) deltas.push(deltaSpan(c, s.vals[n - 1], s.vals[n - 29], "son gün, 4 hafta öncesine göre"));
  return `<div class="kpi" data-mid="${id}"><div class="kpi-h"><span class="kpi-l">${opts.head || esc(c.label)}</span>${tagHtml(s.tag)}${badgeHtml(alertText(c, s))}${helpBtn(noteOf(c))}</div>
    <div class="kpi-v">${fmt(c.unit, cur, { days: false })}</div><div class="kpi-s">${subs.join("")}</div><div class="kpi-d">${deltas.join("")}</div>${spark(s.vals.slice(-30), D.d.days.slice(-30).map((d, k) => { const v = s.vals[s.vals.length - 30 + k]; return `${dLong(d)}<br><b>${v == null ? "—" : fmt(c.unit, v)}</b>`; }))}</div>`;
}
// drop a trailing "(event_name)" only; keep qualifiers such as "(/ bağlanan)"
const shortLabel = (c) => c.label.replace(/\s*\([^()]*_[^()]*\)\s*$/, "");

// ---------- chart control: one component for every chart with its own settings ----------
// Date range (7 / 30 / 90 days or two date fields) and one "Filtre" button holding platform / ülke / sürüm
// (one at a time, like the global filters) and abone tipi; optionally a "Görünüm" select. State per card key,
// kept while the page is open: CS[key] = { range: [from, to] | null, dim, val, sub, view }.

}

    <div class="seg-ctl">${[7, 30, 90].map((k) => `<button type="button" data-n="${k}" aria-pressed="${b === n - 1 && b - a + 1 === Math.min(k, n)}">${k}G</button>`).join("")}</div>
    <input type="date" class="cc-a" aria-label="Başlangıç" min="${d[0]}" max="${d[n - 1]}" value="${d[a]}"><span>–</span><input type="date" class="cc-b" aria-label="Bitiş" min="${d[0]}" max="${d[n - 1]}" value="${d[b]}">
    <details class="cc-f"><summary${active.length ? ' class="on"' : ""}>Filtre${active.length ? " · " + esc(active.join(" · ")) : ""}</summary><div class="cc-pop">
      ${dimSel("platform", "Platform", [["iOS", "iOS"], ["Android", "Android"]])}${dimSel("country", "Ülke", D.d.countries.map((c) => [c, TR_COUNTRY[c] || c]))}${dimSel("version", "Sürüm", D.d.versions.map((v) => [v, v]))}
      <label>Abone <select data-sub>${[["paid", "Tümü"], ["store", "Mağaza"], ["web", "Web"]].map(([v, l]) => opt(v, l, st.sub === v)).join("")}</select></label>

document.addEventListener("change", (ev) => {

document.addEventListener("click", (ev) => {

// Timeline card: counts (top chart) and rates (chart below). Default: daily + 7-day average over the global range;
// opts.key = own date range, opts.noMA = daily values only.
function trendCard(title, counts, rates = [], opts = {}) {
  const id = "c" + Math.random().toString(36).slice(2, 8);
  const draw = () => drawTrend(document.getElementById(id), counts, rates, opts);
  if (opts.key) registerCard(opts.key, opts, draw);
  return { html: `<div class="card${opts.wide ? " wide" : ""}" id="${id}"><div class="card-top"><h2>${esc(title)}</h2><span class="tags"></span>${opts.key ? `<div class="cc-host"></div>` : ""}</div>${opts.sub ? `<p class="card-sub">${opts.sub}</p>` : ""}<div class="legend"></div><div class="chart ch-a"></div>${rates.length && counts.length ? `<div class="legend lg-b"></div><div class="chart ch-b"></div>` : ""}<div class="tip"></div></div>`,
    draw };
}
function seriesFor(ids, k0, [i0, i1], pw, noMA, f = S) {
  return ids.map((mid, k) => {
    const c = D.cat[mid], s = series(mid, f);
    if (!c || !s.vals) return null;
    const ma = noMA ? null : movingAvg(s);
    const fv = (v) => fmt(c.unit, v);
    const o = {
      id: mid, name: shortLabel(c), color: COL[(k0 + k) % COL.length], fmt: fv, tag: s.tag,
      vals: s.vals.slice(i0, i1 + 1), ma: ma ? ma.slice(i0, i1 + 1) : null,
      prev: S.cmp && pw && ma ? ma.slice(pw[0], pw[1] + 1) : null,
      faded: s.den ? s.den.slice(i0, i1 + 1).map((d) => d != null && d < MIN_DEN) : null,
      detail: s.num ? (i) => (s.num[i0 + i] != null && s.den[i0 + i] != null ? ` <small>${fmtCount(s.num[i0 + i], c)} / ${fmtCount(s.den[i0 + i], c)}</small>` : "") : null,
    };

const fmtCount = (v, c) => (/speech_min/.test(c.num || "") ? nf1.format(v) : nf.format(Math.round(v * 10) / 10));
function legendHtml(ser) {
  return ser.map((s) => `<span><i style="--c:${s.color}"></i>${esc(s.name)}</span>`).join("") + (ser.some((s) => s.prev) ? `<span><i class="dash" style="--c:var(--muted)"></i>önceki dönem (7g ort.)</span>` : "");
}
function drawTrend(card, counts, rates, opts) {
  if (!card) return;
  const w = opts.key ? cardWin(opts.key) : win(), pw = opts.key ? null : prevWin(), x = D.d.days.slice(w[0], w[1] + 1);
  if (opts.key) card.querySelector(".cc-host").innerHTML = chartCtl(opts.key);
  const f = opts.key ? cardFilter(opts.key) : S;
  const A = seriesFor(counts.length ? counts : rates, 0, w, pw, opts.noMA, f), B = counts.length ? seriesFor(rates, counts.length, w, pw, opts.noMA, f) : [];
  const tags = [...A, ...B].some((s) => s.tag);
  card.querySelector(".tags").innerHTML = tagHtml(tags) + (opts.help ? helpBtn(opts.help) : "");
  const unitA = D.cat[(counts.length ? counts : rates)[0]]?.unit;
  card.querySelector(".legend").innerHTML = legendHtml(A);
  lineChart(card.querySelector(".ch-a"), card, x, A, { yFmt: yFmtFor(unitA), pctMax: unitA === "pct", threshold: opts.threshold, H: opts.H, aria: card.querySelector("h2").textContent });
  if (B.length) {

    lineChart(card.querySelector(".ch-b"), card, x, B, { yFmt: yFmtFor(D.cat[rates[0]]?.unit), pctMax: D.cat[rates[0]]?.unit === "pct", H: 150 });

const yFmtFor = (unit) => (unit === "pct" ? (t) => "%" + nf.format(Math.round(t * 1000) / 10) : unit === "min" ? (t) => nf.format(t) + " dk" : unit === "ratio" ? (t) => nf2.format(t) : (t) => nf.format(t));

function sortableTable(cols, rows, opts = {}) {

  return customCard("Kullanıcı tipleri", `<div class="legend"></div><div class="chart ch-a"></div>`, (card) => {
    const view = ccState(key).view || "rate", w = cardWin(key), f = cardFilter(key);
    const ids = view === "count" ? ["online", "active", "regular", "northstar"] : ["ns_online", "regular_online"];
    const ser = seriesFor(ids, view === "count" ? 0 : 3, w, null, true, f);
    card.querySelector(".tags").innerHTML = tagHtml(ser.some((x) => x.tag)) + helpBtn(TIERS_HELP);
    card.querySelector(".legend").innerHTML = legendHtml(ser);
    const unit = D.cat[ids[0]].unit;
    lineChart(card.querySelector(".ch-a"), card, D.d.days.slice(w[0], w[1] + 1), ser, { yFmt: yFmtFor(unit), pctMax: unit === "pct", H: 400, aria: "Kullanıcı tipleri" });
  }, { key, days: 90, views: [["rate", "Rate Based"], ["count", "User Based"]] });
}

// Daily speech minutes (area) with online subscribers drawn in the lower part on their own scale
function speechOnlineCard(key) {
  return customCard("Günlük konuşma dakikası ve online abone", `<div class="legend"></div><div class="chart ch-a"></div>`, (card) => {
    const [i0, i1] = cardWin(key), x = D.d.days.slice(i0, i1 + 1);
    const f = cardFilter(key), sm = series("speech_min", f), on = series("online", f);
    card.querySelector(".tags").innerHTML = tagHtml(sm.tag || on.tag) + helpBtn("Toplam konuşma dakikası = Σ speech_duration (> 0) / 60, o günün toplamı. Online = gün içinde dashboard_page_viewed gören tekil abone (sağ eksen).");
    const L = { name: "Toplam konuşma dakikası", color: COL[0], vals: (sm.vals || []).slice(i0, i1 + 1), fmt: (v) => fmt("min", v) };
    const Rr = { name: "Online abone", color: COL[1], vals: (on.vals || []).slice(i0, i1 + 1), fmt: (v) => fmt("count", v) };
    card.querySelector(".legend").innerHTML = `<span><i class="sq" style="--c:${L.color}"></i>${L.name}</span><span><i style="--c:${Rr.color}"></i>${Rr.name} (sağ eksen)</span>`;
    dualChart(card.querySelector(".ch-a"), card, x, L, Rr);
  }, { key, help: "" });
}
function dualChart(host, card, x, L, Rr) {
  const tip = card.querySelector(".tip"), ok = (v) => v != null && Number.isFinite(v);
  const lv = L.vals.filter(ok), rv = Rr.vals.filter(ok);
  if (!lv.length) { host.innerHTML = `<div class="chart-empty">Bu seçimde veri yok.</div>`; return; }
  const n = x.length, W = Math.max(300, Math.round(host.clientWidth || 600)), H = 220, padL = 58, padR = 46, padT = 20, padB = 24;
  const sL = niceStep(Math.max(...lv)), yL1 = Math.max(Math.ceil((Math.max(...lv) * 1.06) / sL) * sL, sL);
  // the online line sits in the lower ~45 % of the plot: its scale tops out at max / 0.45
  const rMax = rv.length ? Math.max(...rv) : 1, sR = niceStep(rMax / 0.45), yR1 = Math.max(Math.ceil(rMax / 0.45 / sR) * sR, sR);
  const yl = (v) => padT + (1 - v / yL1) * (H - padT - padB), yr = (v) => padT + (1 - v / yR1) * (H - padT - padB);
  const X = (i) => padL + (n > 1 ? (i / (n - 1)) * (W - padL - padR) : (W - padL - padR) / 2);
  const path = (vals, y) => { let s = "", pen = false; vals.forEach((v, i) => { if (!ok(v)) { pen = false; return; } s += `${pen ? "L" : "M"}${X(i).toFixed(1)} ${y(v).toFixed(1)} `; pen = true; }); return s; };
  const tl = []; for (let t = 0; t <= yL1 + 1e-9; t += sL) tl.push(t);
  const tr = []; for (let t = 0; t <= yR1 + 1e-9; t += sR) tr.push(t);
  const every = Math.max(1, Math.ceil(n / Math.floor((W - padL - padR) / 58)));
  const area = L.vals.every(ok) ? `<path style="fill:${L.color};opacity:.16" d="${path(L.vals, yl)} L${X(n - 1).toFixed(1)} ${yl(0).toFixed(1)} L${X(0).toFixed(1)} ${yl(0).toFixed(1)} Z"/>` : "";
  const chg = changesIn(x).map(([i, ch]) => `<line class="chg" x1="${X(i).toFixed(1)}" x2="${X(i).toFixed(1)}" y1="${padT - 4}" y2="${H - padB}"><title>${esc(dShort(ch.d) + " · " + ch.note)}</title></line><text class="chg-lbl" x="${X(i).toFixed(1)}" y="${padT - 7}" text-anchor="middle">${esc(ch.version || "◆")}</text>`).join("");
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Konuşma dakikası ve online abone">
    ${tl.map((t) => `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${yl(t).toFixed(1)}" y2="${yl(t).toFixed(1)}"/><text x="${padL - 7}" y="${(yl(t) + 4).toFixed(1)}" text-anchor="end">${nf.format(t)} dk</text>`).join("")}
    ${tr.map((t) => `<text x="${W - padR + 6}" y="${(yr(t) + 4).toFixed(1)}" text-anchor="start" style="fill:${Rr.color}">${nf.format(t)}</text>`).join("")}
    ${chg}${area}<path class="ma only" style="--c:${L.color}" d="${path(L.vals, yl)}"/><path class="ma only" style="--c:${Rr.color}" d="${path(Rr.vals, yr)}"/>
    ${x.map((d, i) => ((n - 1 - i) % every === 0 ? `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${dShort(d)}</text>` : "")).join("")}
    <line class="hover-line" x1="0" x2="0" y1="${padT}" y2="${H - padB}"/>
    ${x.map((_, i) => { const l = i === 0 ? padL : (X(i - 1) + X(i)) / 2, r = i === n - 1 ? W - padR : (X(i) + X(i + 1)) / 2; return `<rect class="hit" data-i="${i}" x="${l.toFixed(1)}" y="${padT}" width="${Math.max(1, r - l).toFixed(1)}" height="${H - padT - padB}"/>`; }).join("")}</svg>`;
  const svg = host.querySelector("svg"), hl = svg.querySelector(".hover-line");
  svg.addEventListener("pointermove", (ev) => {
    const t = ev.target.closest("rect.hit"); if (!t) { tip.style.display = "none"; hl.style.opacity = 0; return; }
    const i = Number(t.dataset.i);
    hl.setAttribute("x1", X(i)); hl.setAttribute("x2", X(i)); hl.style.opacity = 1;
    const ch = (D.d.changes || []).filter((c) => c.d === x[i]).map((c) => `<br><small>▏ ${esc(c.note)}</small>`).join("");
    placeTip(tip, card, svg, W, H, X(i), ok(L.vals[i]) ? yl(L.vals[i]) : padT, `${dLong(x[i])}<br><span class="sw" style="background:${L.color}"></span>${esc(L.name)}: <b>${L.fmt(L.vals[i])}</b><br><span class="sw" style="background:${Rr.color}"></span>${esc(Rr.name)}: <b>${Rr.fmt(Rr.vals[i])}</b>${ch}`);
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; hl.style.opacity = 0; });
}
// Every KPI row on the site uses the overview card: last complete day vs the day before (arrow + number only, the
// comparison in the tooltip), the metric's own count in small text when given (own / withDen / sub), a 30-day sparkline
// with hover values, big 3-per-row layout. spec = [metricId, opts]; opts.mode "week" = last 7 days vs the 7 before.
const kpiRow = (specs) => `<div class="kpis big">${specs.map(([id, o]) => kpiCard(id, null, null, { mode: "day", ...o })).join("")}</div>`;
const RATING_SUB = (i0, i1) => `<span>1–2★ <b>${fmt("pct", periodValue(D.cat.rating_low_rate, series("rating_low_rate"), i0, i1))}</b></span>`;
const SPEECH_SUB = (i0, i1) => `<span><b>${fmt("min", periodValue(D.cat.min_per_active, series("min_per_active"), i0, i1))}</b> / aktif</span>`;

// Daily table (the reference site's transaction list): newest day first, click a row for its breakdown
function dailyTable(key) {
  // [metric, header, colour threshold = relative change vs the previous day]
  const COLS = [["online", "Online", 0.05], ["active", "Aktif", 0.05], ["northstar", "NS", 0.05], ["ns_online", "NS / Online", 0.04], ["regular_online", "Regular / Online", 0.04], ["sessions", "Session", 0.05], ["node_click_rate", "Node click", 0.03], ["node_start_rate_s", "Node start", 0.03],
    ["lesson_start_rate_s", "Ders başlatılan s.", 0.05], ["completion_rate_s", "Tamamlanan s.", 0.05], ["abandon_rate_u", "Yarım bırakma", 0.05], ["speech_min", "Konuşma dk", 0.05], ["rating_high_rate", "4–5★", 0.05]];
  const LIM = Object.fromEntries(COLS.map(([id, , t]) => [id, t]));
  return customCard("Günlük tablo", `<p class="card-sub">En yeni gün üstte. Satıra tıkla: o günün platform ve ülke kırılımı. "s." = session bazlı oran.</p><div class="tbl-wrap" style="max-height:520px"><table class="daily"><thead><tr><th>Tarih</th>${COLS.map(([, l]) => `<th>${esc(l)}</th>`).join("")}<th class="wrap">Not</th></tr></thead><tbody></tbody></table></div>`, (card) => {
    const [i0, i1] = key ? cardWin(key) : win(), f = key ? cardFilter(key) : S;
    const ser = Object.fromEntries(COLS.map(([id]) => [id, series(id, f)]));
    // change vs the previous day above the column's threshold (relative) colours the cell: green = better, red = worse
    const cell = (id, i) => {
      const c = D.cat[id], s = ser[id]; const v = s.vals?.[i], p = s.vals?.[i - 1];
      const faded = s.den && s.den[i] != null && s.den[i] < MIN_DEN;
      const ch = v != null && p ? (v - p) / Math.abs(p) : 0;
      const tone = Math.abs(ch) > LIM[id] ? ((LOWER_BETTER.has(id) ? ch < 0 : ch > 0) ? "up" : "down") : "";
      return `<td class="${[faded ? "faded" : "", tone].join(" ").trim()}"${tone ? ` title="Önceki güne göre ${ch > 0 ? "+" : "−"}%${nf1.format(Math.abs(ch) * 100)}"` : ""}>${fmt(c.unit, v)}</td>`;
    };
    const rows = [];
    for (let i = i1; i >= i0; i--) {
      const d = D.d.days[i], note = (D.d.changes || []).filter((c) => c.d === d).map((c) => c.note).join(" · ");
      rows.push(`<tr class="click" data-i="${i}"><td>${dShort(d)}</td>${COLS.map(([id]) => cell(id, i)).join("")}<td class="wrap">${esc(note)}</td></tr>`);
    }
    const tb = card.querySelector("tbody");
    tb.innerHTML = rows.join("");
    tb.addEventListener("click", (ev) => {
      const tr = ev.target.closest("tr.click"); if (!tr) return;
      const open = tr.classList.contains("open");
      tb.querySelectorAll("tr.detail").forEach((r) => r.remove()); tb.querySelectorAll("tr.open").forEach((r) => r.classList.remove("open"));
      if (open) return;
      tr.classList.add("open");
      tr.insertAdjacentHTML("afterend", `<tr class="detail"><td colspan="${COLS.length + 2}">${dayBreakdown(Number(tr.dataset.i), f.sub)}</td></tr>`);
    });
  }, { key });
}
function dayBreakdown(i, sub = S.sub) {
  const keys = [["p:iOS", "iOS"], ["p:Android", "Android"], ...D.d.countries.map((c) => ["c:" + c, TR_COUNTRY[c] || c])];
  const ids = ["online", "active", "ns_online", "node_click_rate", "completion_rate_s"];
  const f = { dim: null, sub };
  const rows = keys.map(([k, l]) => `<tr><td>${esc(l)}</td>${ids.map((id) => { const s = series(id, { ...f, dim: k[0] === "p" ? "platform" : "country", slice: k }); return `<td>${fmt(D.cat[id].unit, s.vals?.[i])}</td>`; }).join("")}</tr>`).join("");
  return `<div class="det"><div><h4>${dLong(D.d.days[i])} · ${SUB_LABEL[sub]}</h4><table><tr><td></td>${ids.map((id) => `<td><b>${esc(shortLabel(D.cat[id]))}</b></td>`).join("")}</tr>${rows}</table></div></div>`;
}

// scroll a group's heading to just below the sticky page header
function scrollToGrp(k, smooth) {
  const el = document.getElementById("grp-" + k); if (!el) return;
  const head = document.querySelector(".top")?.getBoundingClientRect().bottom || 0;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - Math.max(0, head) - 12, behavior: smooth ? "smooth" : "auto" });
}
document.addEventListener("click", (ev) => { const b = ev.target.closest(".grp-nav button"); if (b) scrollToGrp(b.dataset.grp, true); });

function abandonCard() {

const NEW = { kind: "both" };
const NEW_STEPS = {
  sub: ["Abonelik", "Konuştu", "Ders başlattı", "Ders tamamladı"],
  web: ["Abonelik", "App açtı", "Konuştu", "Ders başlattı", "Ders tamamladı"],
  both: ["Abonelik", "Konuştu", "Ders başlattı", "Ders tamamladı"],
};
// counts per entry day for a cohort set, summed over store + web when kind = both (shared steps only)
function coSet(name, kind = NEW.kind) {
  const C = D.d.co; if (!C || !C.sets[name]) return null;
  const slice = S.dim === "platform" || S.dim === "country" ? sliceKey() : "all";
  const get = (k) => C.sets[name][k]?.[slice];
  const map = name === "act" ? { sub: [0, 1, 2, 3], web: [0, 2, 3, 4] } : null;
  if (kind !== "both") {
    const o = get(kind); if (!o) return null;
    return { steps: o.steps, complete: o.complete, tag: S.dim === "version" || S.sub !== "paid" };
  }
  const a = get("sub"), b = get("web"); if (!a && !b) return null;
  const n = (a || b).steps.length;
  const idxA = map ? map.sub : [...Array(n).keys()], idxB = map ? map.web : [...Array(n).keys()];
  const steps = idxA.map((ia, j) => C.days.map((_, i) => (a ? a.steps[ia][i] : 0) + (b ? b.steps[idxB[j]][i] : 0)));
  const complete = C.days.map((_, i) => (a ? a.complete[i] : true) && (b ? b.complete[i] : true));
  return { steps, complete, tag: S.dim === "version" || S.sub !== "paid" };
}
// matured entry days among the last 28: indices
function maturedIdx(set, lastN = 28) {
  const C = D.d.co, out = [];
  for (let i = C.days.length - 1; i >= 0 && out.length < lastN; i--) if (set.complete[i]) out.push(i);

// Retention slices: platform, country or subscriber type (one at a time; no version slice)

function retFor(f, R) {

// Cohort table: one row per cohort day, DN = users of that cohort who came back on exactly day N.
// Cell colour: vs the column's average (Toplam row) — green above, red below, none within ±2%; the further away, the stronger.
const RET_DAYS = [1, 2, 3, 4, 5, 6, 7, 8, 13, 14, 15, 21];
function retTable(key) {
  return customCard("Product Retention Table", `<div class="tbl-wrap"><table class="ret"><thead></thead><tbody></tbody></table></div>`, (card) => {
    const isNew = (ccState(key).kind || "new") === "new";
    const R = retFor(cardFilter(key), isNew ? D.d.nret : D.d.ret), tb = card.querySelector("tbody");
    card.querySelector("h2").textContent = "Product Retention Table";
    card.querySelector(".tags").innerHTML = tagHtml(R?.tag) + helpBtn((isNew
      ? "New-User Retention — kohort: dashboard'u o gün İLK KEZ gören abone (d0 = ilk dashboard_page_viewed; yeni kullanıcı). DN: aynı kohorttan tam N. takvim gününde (UTC) tekrar dashboard'u gören."
      : "Active-User Return Rate — kohort: o gün online olan TÜM aboneler (yeni + eski; dashboard_page_viewed). DN: aynı kohorttan tam N. takvim gününde (UTC) tekrar online olan. Alışkanlık / geri gelme oranı; klasik (yeni kullanıcı) retention değildir.")
      + " Return On, strict calendar dates. Toplam satırı: dolmuş hücrelerin toplamı (oran = Σ dönen / Σ kohort). Hücre rengi sütun ortalamasına göre: ±%2 içi renksiz, üstü yeşil, altı kırmızı, fark büyüdükçe koyu; henüz dolmamış günler boş. Filtre: platform, ülke veya abone tipi (birini seç; sürüm kırılımı yok).");
    if (!R) { tb.innerHTML = `<tr><td>Veri yok.</td></tr>`; return; }
    const pct = (ccState(key).view || "pct") === "pct", [i0, i1] = cardWin(key), from = D.d.days[i0], to = D.d.days[i1];
    const rows = R.rows.filter((r) => r.d >= from && r.d <= to).sort((a, b) => (a.d < b.d ? 1 : -1)); // newest cohort first
    const tot = RET_DAYS.map((k) => { let a = 0, b = 0; for (const r of rows) if (r.cells[k] != null) { a += r.cells[k]; b += r.users; } return b ? { a, b } : null; });
    const users = rows.reduce((t, r) => t + (r.users || 0), 0);
    const cell = (a, b, j) => {
      if (a == null || !b) return `<td class="na"></td>`;

      let style = "", vs = "";
      if (avg) {
        // within ±2% of the average: no colour; beyond it the tint starts very faint and deepens up to ±25%
        const dev = (p - avg) / avg, k = Math.min(1, Math.max(0, Math.abs(dev) - 0.02) / 0.23);
        if (Math.abs(dev) > 0.02) style = ` style="background:color-mix(in srgb, var(${dev >= 0 ? "--pos" : "--neg"}) ${Math.round(3 + 67 * k ** 1.3)}%, var(--surface))"`;
        vs = ` · ortalamaya göre ${dev >= 0 ? "+" : "−"}%${nf1.format(Math.abs(dev) * 100)}`;
      }
      return `<td${style}${b < MIN_DEN ? ' class="faded"' : ""} title="${nf.format(a)} / ${nf.format(b)} · ${fmt("pct", p)}${vs}">${pct ? fmt("pct", p) : nf.format(a)}</td>`;
    };
    card.querySelector("thead").innerHTML = `<tr><th>Kohort</th><th>Kullanıcı</th>${RET_DAYS.map((k) => `<th>D${k}</th>`).join("")}</tr>`;
    tb.innerHTML = `<tr class="tot"><td>Toplam</td><td class="n">${nf.format(users)}</td>${tot.map((t) => cell(t?.a, t?.b, null)).join("")}</tr>`
      + rows.map((r) => `<tr><td${[0, 6].includes(utc(r.d).getUTCDay()) ? ' class="we" title="Hafta sonu"' : ""}>${dShort(r.d)}</td><td class="n">${nf.format(r.users)}</td>${RET_DAYS.map((k, j) => cell(r.cells[k], r.users, j)).join("")}</tr>`).join("");
  }, { key, kinds: [["new", "New-User Retention"], ["active", "Active-User Return Rate"]], views: [["pct", "Oran"], ["count", "Dönen kullanıcı"]] });
}

  }, { help: "Liste dünün (son tam gün) pay grubundaki aboneleri gösterir. Kullanıcı ID = uygulamadaki sayısal ID (giriş yapmadan kullananlarda yok); Amplitude ID her kullanıcıda var, Amplitude'da kullanıcı aramak için kullanılabilir. Sütunlar son 7 günün toplamı; Abonelik = son aktif gündeki RevenueCat durumu; d0 = ilk dashboard günü (aktivasyondakiler için). Üstteki grafiğin filtresi listeye de uygulanır." });
  return card;
}
// Metric detail: opened by clicking a KPI card on Genel Bakış / Kullanım. Big timeline with its own date range and

SECTIONS.detay = () => {
  const id = S.metric, c = D.cat[id], back = D.d.tabs.find((t) => t.id === S.from)?.label || "Genel Bakış";

  if (simple(c.num) && simple(c.den)) b.push(trendCard(`${D.cat[c.num].label} / ${D.cat[c.den].label}`, [c.num, c.den], [], { key: "det2-" + id, days: 90, wide: true, noMA: true, H: 300 }));
  const head = `<a class="back" href="#${S.from}">← ${esc(back)}</a>`;

// ---------- shell: nav, filters, routing ----------
const OLD = [["genel.html", "Genel (eski)"], ["engagement.html", "Engagement (eski)"], ["dashboard.html", "Product Dashboard (eski)"]];
function buildNav() {
  document.getElementById("nav").innerHTML = D.d.tabs.map((t) => `<a href="#${t.id}" data-tab="${t.id}">${esc(t.label)}</a>`).join("")
    + `<span class="grp">Eski veriler</span>` + OLD.map(([h, l]) => `<a class="old" href="${h}">${esc(l)}</a>`).join("");
}
function buildControls() {
  document.getElementById("range").innerHTML = [7, 14, 28, 90].map((r) => `<button type="button" data-r="${r}">${r} gün</button>`).join("");
  const opt = (v, l) => `<option value="${esc(v)}">${esc(l)}</option>`;
  document.getElementById("f-platform").innerHTML = opt("", "Tümü") + opt("iOS", "iOS") + opt("Android", "Android");
  document.getElementById("f-country").innerHTML = opt("", "Tümü") + D.d.countries.map((c) => opt(c, TR_COUNTRY[c] || c)).join("");
  document.getElementById("f-version").innerHTML = opt("", "Tümü") + D.d.versions.map((v) => opt(v, v)).join("");
  document.getElementById("f-sub").innerHTML = opt("paid", "Tümü") + opt("store", "Mağaza") + opt("web", "Web");
  document.getElementById("range").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (!b) return; S.range = Number(b.dataset.r); if (S.range === 90) S.cmp = false; go(); });
  document.getElementById("cmp").addEventListener("change", (ev) => { S.cmp = ev.target.checked; go(); });
  for (const dim of ["platform", "country", "version"]) document.getElementById("f-" + dim).addEventListener("change", (ev) => { const v = ev.target.value; S.dim = v ? dim : null; S.val = v; go(); });
  document.getElementById("f-sub").addEventListener("change", (ev) => { S.sub = ev.target.value; go(); });
}
function syncControls() {
  document.querySelectorAll("#range button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.r) === S.range)));
  const ownRanges = S.tab === "genel" || S.tab === "retention" || S.tab === "detay";
  document.querySelector(".ctl-row").hidden = ownRanges;
  const cmp = document.getElementById("cmp"), off = S.range === 90;
  cmp.checked = S.cmp && !off; cmp.disabled = off;
  document.getElementById("cmp-wrap").classList.toggle("off", off);
  document.getElementById("cmp-wrap").title = off ? "90 günde önceki dönem verisi yok" : "";
  for (const dim of ["platform", "country", "version"]) { const el = document.getElementById("f-" + dim); el.value = S.dim === dim ? S.val : ""; el.classList.toggle("on", S.dim === dim); }
  const fs = document.getElementById("f-sub"); fs.value = S.sub; fs.classList.toggle("on", S.sub !== "paid");
  const navTab = S.tab === "detay" ? S.from : S.tab;
  document.querySelectorAll("#nav a[data-tab]").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === navTab ? "page" : "false"));
  document.getElementById("title").textContent = S.tab === "detay" ? D.cat[S.metric].label : D.d.tabs.find((t) => t.id === S.tab)?.label || "";
}
function toHash() {
  const p = new URLSearchParams();
  if (S.tab === "detay") { p.set("m", S.metric); p.set("from", S.from); }
  if (S.dim) p.set(S.dim, S.val);
  if (S.sub !== "paid") p.set("sub", S.sub);
  if (S.range !== 28) p.set("range", S.range);
  if (S.cmp) p.set("cmp", "1");
  const q = p.toString();
  return "#" + S.tab + (q ? "?" + q : "");
}
function fromHash() {
  const [tab, q] = location.hash.slice(1).split("?");
  const grp = USE_GROUPS.some(([k]) => k === tab) ? tab : null; // old tabs (#aktif, #node, …) → Kullanım
  const q0 = new URLSearchParams(q || "");
  S.metric = tab === "detay" && D.cat[q0.get("m")] ? q0.get("m") : null; // metric detail page (#detay?m=<id>&from=<tab>)
  S.from = S.metric && D.d.tabs.some((t) => t.id === q0.get("from")) ? q0.get("from") : "genel";
  S.tab = S.metric ? "detay" : grp ? "kullanim" : D.d.tabs.some((t) => t.id === tab) ? tab : "genel";
  S.grp = grp;
  const p = new URLSearchParams(q || "");
  S.dim = null; S.val = "";
  for (const dim of ["platform", "country", "version"]) if (p.get(dim)) { S.dim = dim; S.val = p.get(dim); }
  S.sub = ["store", "web"].includes(p.get("sub")) ? p.get("sub") : "paid";
  S.range = [7, 14, 28, 90].includes(Number(p.get("range"))) ? Number(p.get("range")) : 28;
  S.cmp = p.get("cmp") === "1" && S.range !== 90;
}
function go() { const h = toHash(); if (location.hash !== h) history.replaceState(null, "", h); renderSection(); }
let current = null;
function renderSection() {
  syncControls();
  const host = document.getElementById("sec");
  current = (SECTIONS[S.tab] || SECTIONS.genel)();
  const warn = S.sub !== "paid" && S.tab !== "yeni" && S.tab !== "genel" ? `<div class="notebox"><b>Abone tipi notu:</b> 28 Eylül 2026'ya kadar web (Stripe) aboneleri RevenueCat'te <code>active</code> durumundaydı ve <b>Mağaza</b>'da sayılıyor; o gün web_promo'ya (<code>promotional</code>) taşındılar. Mağaza / Web karşılaştırması 28 Eylül'den itibaren anlamlı.</div>` : "";
  host.innerHTML = `<section class="sec">${warn}${dataNotes()}${current.html}</section>`;
  current.draw();
}
document.addEventListener("click", (ev) => {
  const h = ev.target.closest(".help"); if (!h) return;
  const card = h.closest(".kpi, .card"); const box = card.querySelector(".notebox.h");
  if (box) { box.remove(); return; }
  card.querySelector(".kpi-h, .card-top").insertAdjacentHTML("afterend", `<div class="notebox h">${esc(h.dataset.help)}</div>`);
});
function jumpGrp() { if (S.grp) scrollToGrp(S.grp, false); }
window.addEventListener("hashchange", () => { fromHash(); renderSection(); window.scrollTo(0, 0); jumpGrp(); });
let rt = null;
window.addEventListener("resize", () => { if (!D.d) return; clearTimeout(rt); rt = setTimeout(() => current && current.draw(), 150); });

// ---------- decryption (same keys as the other pages) ----------
const b64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
const getJson = async (path) => { const res = await fetch(`${path}?t=${Date.now()}`, { cache: "no-store" }); if (!res.ok) throw new Error(`${path} yüklenemedi (${res.status})`); return res.json(); };
async function unlock(password) {
  const [keys, box] = await Promise.all([getJson("keys.json"), getJson("product.enc.json")]);
  const s = keys.sealedPrivateKey;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(s.salt), iterations: s.iterations }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let jwkBytes;
  try { jwkBytes = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(s.iv) }, kek, b64(s.ct)); }
  catch (e) { const err = new Error("Şifre yanlış."); err.wrong = true; throw err; }
  const priv = await crypto.subtle.importKey("jwk", JSON.parse(new TextDecoder().decode(jwkBytes)), { name: "RSA-OAEP", hash: "SHA-256" }, false, ["unwrapKey"]);
  const dek = await crypto.subtle.unwrapKey("raw", b64(box.wrappedKey), priv, { name: "RSA-OAEP" }, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, dek, b64(box.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function load(data) {
  if (data.v !== 1 || data.page !== "product") throw new Error("veri biçimi beklenenden farklı, yenileme bekleniyor");
  D.d = data;
  D.cat = Object.fromEntries(data.catalog.map((c) => [c.id, c]));
  document.getElementById("data-date").textContent = dYear(data.dataDate);
  document.getElementById("updated-at").textContent = tsFmt(data.generatedAt);
  buildNav(); buildControls(); fromHash();
  lockEl.hidden = true; appEl.hidden = false;
  renderSection(); jumpGrp();
}

// ---------- lock screen (password shared with the other pages) ----------
const STORE_KEY = "lucida-data:pass";
const store = {
  get() { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(STORE_KEY, v); } catch (e) { /* private mode */ } },
  clear() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ } },
};
const lockEl = document.getElementById("lock"), appEl = document.getElementById("app");
const form = document.getElementById("lock-form"), passEl = document.getElementById("lock-pass");
const rememberEl = document.getElementById("lock-remember"), btnEl = document.getElementById("lock-btn"), errEl = document.getElementById("lock-err");
async function open(password, remember) {
  btnEl.disabled = true; errEl.textContent = ""; btnEl.textContent = "Açılıyor…";
  try {
    load(await unlock(password));
    if (remember) store.set(password);
  } catch (e) {
    if (e.wrong) store.clear();
    errEl.textContent = e.wrong ? "Şifre yanlış." : "Veri yüklenemedi: " + (e.message || e);
    lockEl.hidden = false; appEl.hidden = true;
  } finally { btnEl.disabled = false; btnEl.textContent = "Aç"; }
}
form.addEventListener("submit", (ev) => { ev.preventDefault(); open(passEl.value, rememberEl.checked); });
document.getElementById("lock-out").addEventListener("click", () => { store.clear(); passEl.value = ""; appEl.hidden = true; lockEl.hidden = false; passEl.focus(); });

// Local testing only: ?plain=<file> reads an unencrypted payload, and only on localhost.
const plain = new URLSearchParams(location.search).get("plain");
if (plain && ["localhost", "127.0.0.1"].includes(location.hostname)) getJson(plain).then(load).catch((e) => { errEl.textContent = "Yerel veri yüklenemedi: " + e.message; });
else { const saved = store.get(); if (saved) open(saved, true); else passEl.focus(); }
</script>
